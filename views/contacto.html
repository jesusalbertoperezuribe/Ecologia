<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMarket - Contacto</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="sobre-nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor">
    <h1>Contacto</h1>
    <form class="form-contacto">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="tu@email.com" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>

      <button type="submit" class="btn">Enviar</button>
    </form>
  </main>

  <footer>
    <div class="redes-sociales">
      <a href="#" class="icono-red" aria-label="Instagram">📸 Instagram</a>
      <a href="#" class="icono-red" aria-label="Facebook">📘 Facebook</a>
      <a href="#" class="icono-red" aria-label="WhatsApp">💬 WhatsApp</a>
    </div>
  </footer>
</body>
</html>
