<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMarket - Contacto</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <header>
    <div class="contenedor header-contenido">
      <h2>🌱 EcoMarket</h2>
      <nav>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="productos.html">Catálogo</a></li>
          <li><a href="sobre-nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div>
        <a href="productos.html">🔍 Buscar</a> |
        <a href="productos.html">🛒 Carrito</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <section>
      <h1>Contacto</h1>
      <form class="form-contacto">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>

        <button type="submit" class="btn">Enviar</button>
      </form>

      <div class="ubicacion">
        <h3>Nuestra Ubicación</h3>
        <img src="../img/mapa.jpg" alt="Mapa de la sede EcoMarket" class="img-mapa">
      </div>
    </section>
  </main>

  <footer>
    <p>EcoMarket &copy; 2026 - Contacto: info@ecomarket.com</p>
    <div class="redes-sociales">
      <a href="#" class="icono-red" aria-label="Instagram">📸 Instagram</a>
      <a href="#" class="icono-red" aria-label="Facebook">📘 Facebook</a>
      <a href="#" class="icono-red" aria-label="WhatsApp">💬 WhatsApp</a>
    </div>
  </footer>
</body>
</html>
