<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | EcoMarket</title>
  <meta name="description" content="Ponte en contacto con el equipo de EcoMarket.">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <header class="header">
    <div class="contenedor header__contenedor">
      <a href="../index.html" class="header__logo">🌱 EcoMarket</a>
      <nav class="header__nav" aria-label="Navegación principal">
        <ul class="header__lista">
          <li class="header__item"><a href="../index.html" class="header__enlace">Inicio</a></li>
          <li class="header__item"><a href="productos.html" class="header__enlace">Productos</a></li>
          <li class="header__item"><a href="sobre-nosotros.html" class="header__enlace">Nosotros</a></li>
          <li class="header__item"><a href="contacto.html" class="header__enlace header__enlace--activo">Contacto</a></li>
        </ul>
      </nav>
      <div class="header__acciones">
        <a href="productos.html" class="header__icono">🔍 Búsqueda</a>
        <a href="productos.html" class="header__icono">🛒 Carrito (2)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <section>
      <h1>Contacto</h1>
      <form class="form-contacto">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>

        <button type="submit" class="btn">Enviar</button>
      </form>

      <div class="ubicacion">
        <h3>Nuestra Ubicación</h3>
        <img src="../img/fondo.webp" alt="Mapa de la sede EcoMarket" class="img-mapa">
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="contenedor footer__contenedor">
      <p><strong>🌱 EcoMarket</strong> &copy; 2026 - Contacto: info@ecomarket.com</p>
      <div class="redes-sociales">
        <a href="https://instagram.com" target="_blank" rel="noopener" class="icono-red" aria-label="Instagram">📸 Instagram</a>
        <a href="https://facebook.com" target="_blank" rel="noopener" class="icono-red" aria-label="Facebook">📘 Facebook</a>
        <a href="https://whatsapp.com" target="_blank" rel="noopener" class="icono-red" aria-label="WhatsApp">💬 WhatsApp</a>
      </div>
    </div>
  </footer>
</body>
</html>
